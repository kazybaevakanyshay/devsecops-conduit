name: conduit

services:
  db:
    image: postgres:16
    env_file: /etc/conduit/conduit.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/kazybaevakanyshay/conduit-api:${TAG}
    env_file: /etc/conduit/conduit.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      interval: 10s
      retries: 6
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  web:
    image: ghcr.io/kazybaevakanyshay/conduit-web:${TAG}
    env_file: /etc/conduit/web.env
    environment:
      REACT_PUBLIC_API_ENDPOINT: http://api:8000/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
